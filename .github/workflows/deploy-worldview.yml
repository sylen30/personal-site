name: Deploy WorldView to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/analyze-gods-eye-technique-ZEEv1
    paths:
      - 'worldview/**'
      - '.github/workflows/deploy-worldview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worldview/package-lock.json

      - run: npm ci

      - name: Build
        env:
          BASE_PATH: /personal-site/
          VITE_CESIUM_ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
          VITE_AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          VITE_GOOGLE_3D_TILES_KEY: ${{ secrets.GOOGLE_3D_TILES_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: worldview/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
