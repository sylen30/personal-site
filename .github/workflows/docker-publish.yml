name: Deploy to VPS

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Login to GHCR (using the PAT)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the new image
            docker pull ghcr.io/${{ github.repository }}:latest
            
            # Find and stop ANY container using port 80
            echo "Checking for containers using port 80..."
            CONTAINER_ON_80=$(docker ps --format '{{.ID}}' --filter "publish=80")
            if [ ! -z "$CONTAINER_ON_80" ]; then
              echo "Found container(s) using port 80: $CONTAINER_ON_80"
              docker stop $CONTAINER_ON_80 || true
              docker rm $CONTAINER_ON_80 || true
            fi
            
            # Also explicitly stop and remove personal-site by name
            docker stop personal-site || true
            docker rm personal-site || true
            
            # Check if port 80 is still in use by a system process
            if lsof -i :80 >/dev/null 2>&1; then
              echo "WARNING: Port 80 is still in use by a system process:"
              lsof -i :80 || true
              echo "You may need to stop nginx/apache or other services manually"
            fi
            
            # Wait a moment for port to be released
            sleep 2
            
            # Run the new container
            # Using --restart unless-stopped to ensure it comes back up on reboot
            docker run -d \
              --name personal-site \
              --restart unless-stopped \
              -p 80:80 \
              -e APP_ENV=production \
              -e APP_DEBUG=true \
              -e APP_URL=http://${{ secrets.VPS_HOST }} \
              ghcr.io/${{ github.repository }}:latest
            
            # Prune old images to save space
            docker image prune -f

            # Wait for container to be ready
            sleep 3

            # Create .env file from example
            docker exec personal-site cp .env.example .env

            # Generate app key
            docker exec personal-site php artisan key:generate --force

            # Fix storage permissions
            docker exec personal-site chmod -R 775 /var/www/html/storage
            docker exec personal-site chown -R www-data:www-data /var/www/html/storage

            # Run migrations
            docker exec personal-site php artisan migrate --force
