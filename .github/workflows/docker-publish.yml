name: Deploy to VPS

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Login to GHCR (using the PAT)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the new image
            docker pull ghcr.io/${{ github.repository }}:latest
            
            echo "===== DEBUG: Checking what's using port 80 ====="
            
            # Show all running containers
            echo "All running Docker containers:"
            docker ps
            
            # Check for containers using port 80 (various ways)
            echo -e "\nContainers with port 80 mapped:"
            docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Ports}}" | grep -E "PORTS|:80" || echo "None found with grep"
            
            # More aggressive: stop ALL containers using port 80
            echo -e "\nStopping all containers with port 80..."
            docker ps -q --filter "publish=80" | xargs -r docker stop
            docker ps -q --filter "publish=80" | xargs -r docker rm
            
            # Also try stopping by inspecting all containers
            for container in $(docker ps -q); do
              if docker port $container 2>/dev/null | grep -q ":80"; then
                echo "Found container $container using port 80, stopping..."
                docker stop $container
                docker rm $container
              fi
            done
            
            # Stop personal-site specifically
            docker stop personal-site 2>/dev/null || true
            docker rm personal-site 2>/dev/null || true
            
            # Check for system processes using port 80
            echo -e "\nChecking for system processes on port 80..."
            sudo lsof -i :80 || echo "lsof not available or no processes found"
            sudo netstat -tulpn | grep :80 || echo "No processes found on port 80"
            
            # Wait for port to be released
            echo -e "\nWaiting for port to be released..."
            sleep 3
            
            # Try to run the new container
            echo -e "\nStarting new container..."
            docker run -d \
              --name personal-site \
              --restart unless-stopped \
              -p 80:80 \
              -e APP_ENV=production \
              -e APP_DEBUG=true \
              -e APP_URL=http://${{ secrets.VPS_HOST }} \
              ghcr.io/${{ github.repository }}:latest
            
            # Check if it started successfully
            if docker ps | grep -q personal-site; then
              echo "Container started successfully!"
            else
              echo "ERROR: Container failed to start"
              docker ps -a | grep personal-site
              exit 1
            fi
            
            # Prune old images to save space
            docker image prune -f

            # Wait for container to be ready
            sleep 5

            # Create .env file from example
            docker exec personal-site cp .env.example .env || echo "Warning: Could not copy .env"

            # Generate app key
            docker exec personal-site php artisan key:generate --force || echo "Warning: Could not generate key"

            # Fix storage permissions
            docker exec personal-site chmod -R 775 /var/www/html/storage || echo "Warning: Could not set permissions"
            docker exec personal-site chown -R www-data:www-data /var/www/html/storage || echo "Warning: Could not set ownership"

            # Run migrations
            docker exec personal-site php artisan migrate --force || echo "Warning: Migrations failed"
            
            echo -e "\n===== Deployment complete ====="
            docker ps | grep personal-site
