name: Docker

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            # Login to GHCR (using the PAT)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the new image
            docker pull ghcr.io/${{ github.repository }}:latest
            
            # Stop and remove the old container (if it exists)
            docker stop personal-site || true
            docker rm personal-site || true
            
            # Run the new container
            # Using --restart unless-stopped to ensure it comes back up on reboot
            docker run -d \
              --name personal-site \
              --restart unless-stopped \
              -p 80:80 \
              -e APP_KEY='${{ secrets.APP_KEY }}' \
              -e APP_ENV=production \
              -e APP_DEBUG=true \
              -e APP_URL=http://${{ secrets.VPS_HOST }} \
              ghcr.io/${{ github.repository }}:latest
            
            # Prune old images to save space
            docker image prune -f

            # Run migrations
            docker exec personal-site php artisan migrate --force
